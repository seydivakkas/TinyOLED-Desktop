name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m compileall -q main.py core apps desktop config

      - name: Installer shell syntax
        run: bash -n install.sh

      - name: Application inventory sanity check
        run: |
          python - <<'PY'
          from pathlib import Path

          apps = [p for p in Path("apps").glob("*.py") if p.name != "__init__.py"]
          print(f"Application modules discovered: {len(apps)}")
          if len(apps) < 50:
              raise SystemExit("Application inventory unexpectedly dropped below 50 modules")
          PY

      - name: Browser simulator contract
        run: |
          test -f web-simulator/index.html
          test -f web-simulator/index.css
          test -f web-simulator/main.js
          grep -q "main.js" web-simulator/index.html

      - name: JavaScript syntax check
        run: |
          node --check web-simulator/main.js
          find web-simulator/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
